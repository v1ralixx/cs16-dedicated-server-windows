; ==================================================
;  users.ini — права администраторов AMX Mod X
; ==================================================
;
; Формат: "name" "password" "access_flags" "account_flags"
;
; access_flags:
;   a - immunity          b - reservation
;   c - amx_kick          d - amx_ban / amx_unban
;   e - amx_slay          f - amx_map
;   g - amx_cvar          h - amx_cfg
;   i - amx_chat          j - amx_vote
;   k - sv_password       l - sv_restart / sv_restartround
;   m - amx_votemap       n - amx_banmenu
;   o - amx_slaymenu      p - amx_cvarmenu
;   q - amx_cfgmenu       r - amx_mapmenu
;   s - amx_teleportmenu  t - amx_changemenu
;   u - menu access       z - user (standard)
;
; account_flags:
;   a - disconnect         b - nick change
;   c - SteamID (No-Steam = unionID)
;   d - IP
;   e - password
;   k - name (по нику)
;

