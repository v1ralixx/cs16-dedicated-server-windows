// ==================================================
//  CS 1.6 Server Configuration
//  Расположение: hlds/cstrike/server.cfg
// ==================================================

// ---------- Основное ----------
hostname                "Мой CS 1.6 Server"
rcon_password           "СМЕНИ_МЕНЯ_НА_СЛОЖНЫЙ_ПАРОЛЬ"
sv_password             ""              // пароль на вход ("" = без пароля)
sv_lan                  0               // 0 = интернет, 1 = только LAN
sv_region               255             // 255 = World, 3 = Europe, 1 = US East

// ---------- Сеть ----------
sv_maxrate              25000
sv_minrate              5000
sv_maxupdaterate        101
sv_minupdaterate        30
sv_maxcmdrate           101
sv_mincmdrate           30
sv_clienttrace          1
sv_unlag                1
sv_unlagpush            0
sv_unlagsamples         1
sv_maxspeed             320
sys_ticrate             1000
fps_max                 600

// ---------- FastDL (закомментировано — включи, если есть веб-сервер) ----------
// sv_downloadurl "http://your-site.com/cstrike/"
// sv_allowdownload 1
// sv_allowupload   0

// ---------- Раунды ----------
mp_timelimit            30
mp_roundtime            3
mp_freezetime           3
mp_buytime              0.5
mp_c4timer              35
mp_round_infinite       0
mp_winlimit             0
mp_maxrounds            0
mp_hostagepenalty       2
mp_autoteambalance      1
mp_limitteams           2
mp_autokick             1
mp_tkpunish             0
mp_friendlyfire         0
mp_fadetoblack          0
mp_forcechasecam        0
mp_forcecamera          0
mp_chasecam             0
mp_flashlight           1
mp_footsteps            1
mp_weaponstay           0

// ---------- Логирование ----------
log                     on
mp_logfile              1
mp_logdetail            3
mp_logmessages          1
mp_logecho              0

// ---------- Прочее ----------
sv_cheats               0
sv_aim                  0
sv_gravity              800
sv_airaccelerate        10
sv_wateraccelerate      10
sv_friction             4
sv_accelerate           5
sv_stopspeed            100
allow_spectators        1
decalfrequency          60
pausable                0
// --- ReUnion / No-Steam ---
sv_visiblemaxplayers    20
// ---
exec banned.cfg
exec listip.cfg
echo "server.cfg loaded OK"